name: Kyrelo
options:
  bundleIdPrefix: com.sobytes
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "FT97GD7996"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

schemes:
  Kyrelo:
    build:
      targets:
        Kyrelo: all
        KyreloTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KyreloTests
    archive:
      config: Release

targets:
  Kyrelo:
    type: application
    platform: iOS
    sources:
      - path: Kyrelo
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sobytes.kyrelo.mobile
        INFOPLIST_FILE: Kyrelo/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  KyreloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KyreloTests
      # Shared with the desktop app's tests (see contracts/README.md), copied
      # into the test bundle as a "contracts" folder.
      - path: ../../contracts
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sobytes.kyrelo.mobile.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kyrelo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kyrelo"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Kyrelo
